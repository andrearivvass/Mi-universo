backend:
  name: git-gateway
  branch: main

locale: es

collections:
  - name: "pensamientos"
    label: "Pensamientos"
    folder: "contenido/pensamientos"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Fecha", name: "date", widget: "string", default: "23 NOVIEMBRE 2026" }
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Número (ej. N.º 001)", name: "number", widget: "string", required: false }
      - { label: "Contenido", name: "body", widget: "markdown" }

  - name: "diario"
    label: "El Diario"
    folder: "contenido/diario"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Fecha", name: "date", widget: "string", default: "23 NOVIEMBRE 2026" }
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Número (ej. N.º 001)", name: "number", widget: "string", required: false }
      - { label: "Historia", name: "body", widget: "markdown" }

  - name: "apartados"
    label: "Nuevos Apartados"
    folder: "contenido/apartados"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Nombre del apartado", name: "title", widget: "string" }
      - { label: "Etiqueta superior (ej. 05 / EXTRA)", name: "tag", widget: "string", required: false }
      - { label: "Descripción corta", name: "summary", widget: "string", required: false }
      - { label: "Texto del apartado", name: "body", widget: "markdown" }
